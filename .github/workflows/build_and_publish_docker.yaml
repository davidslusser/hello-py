name: Build and Push Docker Image

on:
  release:
    types: [created]
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-dev'
      - '[0-9]+.[0-9]+.[0-9]+-dev.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract tag
        id: extract_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="latest"
          fi

          image_name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "repository_name=${image_name##*/}" >> "$GITHUB_OUTPUT"

          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            IMAGE_TAG=${{ steps.extract_tag.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.extract_tag.outputs.image_name }}:${{ steps.extract_tag.outputs.tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.extract_tag.outputs.repository_name }}:${{ steps.extract_tag.outputs.tag }}
            ${{ steps.extract_tag.outputs.latest == 'true' && format('ghcr.io/{0}:latest', steps.extract_tag.outputs.image_name) || '' }}
            ${{ steps.extract_tag.outputs.latest == 'true' && format('docker.io/{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, steps.extract_tag.outputs.repository_name) || '' }}
